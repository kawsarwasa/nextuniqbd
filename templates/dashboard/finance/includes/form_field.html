<div class="mb-3{% if field.errors %} has-validation{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="form-check">
      {{ field }}
      <label class="form-check-label" for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %}<span class="text-danger" aria-hidden="true">*</span>{% endif %}
      </label>
    </div>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">
      {{ field.label }}{% if field.field.required %}<span class="text-danger" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors }}</div>{% endif %}
</div>
