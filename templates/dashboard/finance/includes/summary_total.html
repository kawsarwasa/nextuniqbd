{% load finance_tags %}
<div class="col-12 col-sm-6 col-xl-3">
  <div class="card h-100 mb-0">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <span class="text-body-secondary small">{{ label }}</span>
        <i class="bi {{ icon|default:'bi-wallet2' }} text-{{ tone|default:'primary' }}" aria-hidden="true"></i>
      </div>
      <div class="fs-4 fw-semibold mt-2">{{ value|money }}</div>
    </div>
  </div>
</div>
