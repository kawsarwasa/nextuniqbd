<nav class="navbar" id="navbar">
  <div class="container nav-inner">
    <div class="nav-all-categories">
      <button class="all-cat-btn"><i class="fa fa-bars"></i> All Categories</button>
      <div class="all-cat-dropdown">
        {% for category in navbar_categories %}
          <a href="{% url 'frontend_products' %}?category={{ category.slug }}">
            <i class="{{ category.icon_class|default:'fa fa-tag' }}"></i> {{ category.name }}
          </a>
        {% empty %}
          <a href="{% url 'frontend_products' %}"><i class="fa fa-tag"></i> Browse Categories</a>
        {% endfor %}
      </div>
    </div>

    <ul class="nav-links">
      <li><a href="{% url 'frontend_home' %}"{% if active_page == 'home' %} class="active"{% endif %}>Home</a></li>
      <li><a href="{% url 'frontend_products' %}"{% if active_page == 'products' %} class="active"{% endif %}>Product</a></li>
      <li class="nav-cart-item"><a href="{% url 'frontend_cart' %}"{% if active_page == 'cart' %} class="active"{% endif %}>Cart</a></li>
      <li class="nav-contact-item"><a href="{% url 'frontend_contact' %}"{% if active_page == 'contact' %} class="active"{% endif %}>Contact</a></li>
    </ul>
  </div>
</nav>
